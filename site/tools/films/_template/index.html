<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- eSports Boost film "__NAME__". Timing: assets/timing.js, written by ../build_film.py — never edit it by hand.
         SAFE ZONE (Reels/Meta): keep anything that must be read between y=180 and y=1550. The bottom of the frame
         is covered by the platform's own UI, which is why the CTA sits at 1110 and the chevrons point DOWN at it. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/timing.js"></script>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      // These films are HTML + CSS + GSAP. The Three.js half of the Enevie template is not
      // carried over — nothing here draws in 3D, and 2 MB of vendor code in every project is
      // 2 MB nobody reads. Bring it back from that project if a film ever needs a scene.
      const norm = (s) => s.toLowerCase().replace(/[^\p{L}\p{N}']/gu, "");
      // Instant (s, temps de la prise, décalage de 0,3 s compris) où le mot `w` est prononcé, à partir de `after`.
      // `w` s'écrit en minuscules, accents gardés, ponctuation et tirets retirés : W("électricité"), W("soixantedix"), W("l'offre").
      window.W = (w, after = 0, end = false) => {
        for (const x of VO.words) if (x.s >= after - 1e-6 && norm(x.w) === w) return end ? x.e : x.s;
        throw new Error("mot introuvable : " + w);
      };
    </script>
    <style>
      /* Inter, self-hosted — the site's own face (site/public/assets/fonts). Montserrat was
         a stand-in borrowed from the other project; a film that quotes this shop's prices
         should be set in this shop's type. Inter stops at 700 here, and 700 is what the
         site's own display weight is. */
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-400-latin.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-500-latin.woff2") format("woff2"); font-weight: 500; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-600-latin.woff2") format("woff2"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
      :root {
        /* Ashfall — the site's own tokens (site/public/assets/css/ashfall.css). */
        --bg: #06060a; --bg-2: #08080d; --panel: #0e0e16; --hair: #262632;
        --ink: #f4f1ec; --muted: #a8a5b2; --dim: #8b8b99;
        --ember: #ff4a1f; --ember-lit: #ff6a3d; --amber: #ffb84c; --green: #34c77b; --red: #e0574f;
        --grad: linear-gradient(160deg, #ff6a3d 0%, #ff4a1f 100%);
        --grad-h: linear-gradient(90deg, #ff6a3d 0%, #ff4a1f 100%);
        /* Rank colours — the SAME table the site draws marks from (D.tier_color). */
        --iron: #8e8f94; --bronze: #b1764c; --silver: #a3adb8; --gold: #e0ac3e;
        --plat: #4fb0aa; --emerald: #3fa06c; --diamond: #5f93de; --master: #a56fd0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; }
      .layer { position: absolute; inset: 0; }
      .abs { position: absolute; }
      /* Masked text (rises into a window): <div class="m"><div id="..">text</div></div> */
      .m { overflow: hidden; padding: 14px 0 6px; margin: -14px 0 -6px; }

      /* The close: logo + gradient button + chevrons pointing at the platform button under the video. */
      #endLogo { left: 0; right: 0; top: 690px; text-align: center; z-index: 8; }
            /* .hd-brand + .shard, scaled up for a 1080-wide frame (the site draws them at 17px/10x22). */
      #lockup { display: inline-flex; align-items: center; gap: 22px; }
      #shard { width: 46px; height: 102px; flex: none; background: linear-gradient(#ffb046, #ff3d0f);
               clip-path: polygon(0 0, 100% 18%, 62% 100%, 18% 62%); }
      #wordmark { font-size: 78px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: #f2efec; }
      #wordmark b { font-weight: 700; color: #ff5a1f; }
      .logo-sub { display: inline-flex; margin-top: 16px; font-size: 28px; font-weight: 700; letter-spacing: 0.15em; color: var(--muted); }
      #cta { left: 120px; top: 1110px; width: 840px; height: 140px; z-index: 8; }
      .btn { position: relative; width: 100%; height: 100%; border-radius: 70px; background: var(--grad-h); overflow: hidden;
        color: #06060a; font-size: 46px; font-weight: 700; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 20px 44px rgba(255, 74, 31, 0.38); }
      #ctaShine { position: absolute; top: -30%; left: 0; width: 150px; height: 160%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0)); }
      #chev { left: 490px; top: 1268px; width: 100px; height: 90px; z-index: 8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-film data-width="1080" data-height="1920">
      <!-- … the film's scenes … -->

      <!-- THE REAL BRAND LOCKUP, redrawn from the site's own header (.hd-brand + .shard in
           site.css): the shard, then "esports" in the text colour and "boost" in the ember,
           uppercase. The green bird in assets/logo-wide.png is a Google Ads export of an older
           mark and is NOT what the site shows. -->
      <div id="endLogo" class="abs">
        <div id="lockup"><span id="shard"></span><span id="wordmark">esports<b>boost</b></span></div>
        <div class="m"><div id="endSub" class="logo-sub">PICK YOUR RANK</div></div>
      </div>
      <div id="cta" class="abs"><div class="btn"><span>Start my climb</span><div id="ctaShine" data-layout-allow-overflow></div></div></div>
      <div id="chev" class="abs"><svg id="chevIn" width="100" height="90" viewBox="0 0 60 54"><path d="M14 10l16 13 16-13M14 27l16 13 16-13" stroke="var(--ember)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></div>

      <!-- Soundtrack (voice + music + cues), written by ../build_film.py; the duration is copied in. -->
      <audio id="bande-son" class="clip" data-start="0" data-duration="25" data-track-index="9" data-volume="1" src="assets/bande-son.wav"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      Promise.all(["900 100px Inter", "800 40px Inter", "700 40px Inter"].map((f) => document.fonts.load(f))).then(() => {
        // Titres trop longs : la police rétrécit jusqu'à tenir sur une ligne (classe .fit)
        for (const el of document.querySelectorAll(".fit")) {
          let fs = parseFloat(getComputedStyle(el).fontSize);
          while (el.scrollWidth > el.clientWidth + 1 && fs > 30) { fs -= 2; el.style.fontSize = fs + "px"; }
        }
        const tl = gsap.timeline({ paused: true });
        const Ls = VO.lines.map((l) => l.start), Le = VO.lines.map((l) => l.end), T = VO.total;
        const IN = (sel, t, d = 0.42) => tl.fromTo(sel, { yPercent: 165 }, { yPercent: 0, duration: d, ease: "power3.out" }, t);
        const OUT = (sels, t) => tl.fromTo(sels, { yPercent: 0, opacity: 1 }, { yPercent: -165, opacity: 0, duration: 0.26, ease: "power2.in", stagger: 0.03, immediateRender: false }, t);
        const POP = (sel, t, d = 0.5) => tl.fromTo(sel, { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: "back.out(2)" }, t);

        // … animations calées sur les mots : W("mot"), Ls[i] (début de la phrase i), Le[i] (fin) …

        // Fin : logo + bouton (ici, juste après la dernière phrase)
        const tEnd = Ls[Ls.length - 1];
        tl.fromTo("#lockup", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, tEnd);
        IN("#endSub", tEnd + 0.15);
        tl.fromTo("#cta", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, tEnd + 0.3);
        tl.fromTo("#ctaShine", { x: -220 }, { x: 1000, duration: 0.8, ease: "power2.inOut" }, tEnd + 0.9);
        tl.fromTo("#chev", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tEnd + 0.5);
        tl.fromTo("#chevIn", { y: -6 }, { y: 10, duration: 0.32, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, 2 * Math.floor((T - tEnd - 0.8) / 0.64) - 1) }, tEnd + 0.8);

        // Tout est construit en temps de la prise ; le film le joue à VO.speed (1 ici)
        const film = gsap.timeline({ paused: true });
        film.add(tl.paused(false).timeScale(VO.speed || 1), 0);
        window.__timelines["main"] = film;
      });
    </script>
  </body>
</html>
